# Limit the ZFS ARC to 8 GiB (8 * 1024^3 bytes). Without a limit it may
# grow to nearly all RAM and only shrinks under memory pressure, which
# applications notice as stalls.
#
# Copy to /etc/modprobe.d/zfs.conf. Root is on ZFS, so the module loads
# from the initramfs: rebuild it
# (update-initrd <kver>) for this to apply at boot. To apply right away:
#   echo 8589934592 | sudo tee /sys/module/zfs/parameters/zfs_arc_max
options zfs zfs_arc_max=8589934592
